version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Frontend dependencies must be upgraded together with regenerated web/dist
    # assets, which Dependabot cannot include in its pull requests. Keep these
    # updates manual so an incomplete dependency PR cannot appear merge-ready.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
