version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-toolchain:
        patterns:
          - "@sveltejs/*"
          - svelte
          - svelte-check
          - typescript
          - vite
    ignore:
      # svelte-check does not support TypeScript 7 yet. Keep compatible minor
      # and patch updates automated, and revisit this when its peer range moves.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
